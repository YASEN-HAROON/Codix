<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gratafy • Dashboard</title>
    <link rel="stylesheet" href="main.css">
  </head>
  <body>
    <div class="background"></div>
    <div class="stars"></div>

    <div class="container">
      <div class="logo">
        <h1 id="greeting">Welcome</h1>
      </div>

      <p class="dashboard-text">You're signed in. This page just proves the backend
        issued you a real session — it checked <code>/api/me</code> using your
        auth cookie to get here.</p>

      <button type="button" class="btn" id="logout-btn">LOG OUT →</button>
    </div>

    <script>
      (async () => {
        try {
          const res = await fetch('/api/me', { credentials: 'include' });
          if (!res.ok) throw new Error();
          const { user } = await res.json();
          document.getElementById('greeting').textContent = `Hi, ${user.full_name.split(' ')[0]}`;
        } catch {
          window.location.href = '/index.html';
        }
      })();

      document.getElementById('logout-btn').addEventListener('click', async () => {
        await fetch('/api/logout', { method: 'POST', credentials: 'include' });
        window.location.href = '/index.html';
      });
    </script>
  </body>
</html>
