<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codix • Profile</title>
    <link rel="stylesheet" href="pages.css">
  </head>
  <body data-page="profile">
    <div class="background"></div>
    <div class="stars"></div>

    <div class="app">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-logo">
          <span class="logo-mark">C</span>
          <span class="logo-text">Codix</span>
        </div>

        <nav class="sidebar-nav">
          <a href="dashboard.html" class="nav-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            Dashboard
          </a>
          <a href="#" class="nav-item active">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            Profile
          </a>
          <a href="projects.html" class="nav-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
            Projects
          </a>
          <a href="settings.html" class="nav-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            Settings
          </a>
        </nav>

        <div class="sidebar-footer">
          <a href="index.html" class="nav-item logout" id="logoutBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Log out
          </a>
        </div>
      </aside>

      <!-- Main content -->
      <main class="main">
        <header class="header">
          <div class="header-left">
            <h1>Profile</h1>
            <p class="subtitle">Manage your account</p>
          </div>
          <div class="header-right">
            <span class="form-error" id="formError" style="margin:0;"></span>
            <button class="btn-sm" type="button" id="saveProfileBtn">Save changes</button>
          </div>
        </header>

        <!-- Profile hero -->
        <section class="profile-hero card">
          <div class="profile-hero-left">
            <div class="profile-avatar-wrap">
              <div class="profile-avatar" id="profileAvatar">A</div>
              <button class="avatar-edit" type="button" title="Change photo">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                  <circle cx="12" cy="13" r="4"/>
                </svg>
              </button>
            </div>
            <div class="profile-hero-info">
              <h2 id="profileHeroName">Loading…</h2>
              <p class="profile-meta" id="profileHeroMeta"></p>
            </div>
          </div>
          <div class="profile-hero-stats">
            <div class="ph-stat">
              <span class="ph-value" id="heroProjects">–</span>
              <span class="ph-label">Projects</span>
            </div>
            <div class="ph-stat">
              <span class="ph-value" id="heroTasks">–</span>
              <span class="ph-label">Tasks</span>
            </div>
            <div class="ph-stat">
              <span class="ph-value" id="heroHours">–</span>
              <span class="ph-label">Hours</span>
            </div>
          </div>
        </section>

        <div class="profile-grid">
          <!-- Personal info -->
          <section class="card">
            <div class="card-header">
              <h2>Personal information</h2>
            </div>
            <form class="profile-form" id="profileForm" onsubmit="return false;">
              <div class="form-row">
                <div class="form-group">
                  <label>Full name</label>
                  <input type="text" id="fieldFullName">
                </div>
                <div class="form-group">
                  <label>Display name</label>
                  <input type="text" id="fieldDisplayName">
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Email</label>
                  <input type="email" id="fieldEmail">
                </div>
                <div class="form-group">
                  <label>Phone</label>
                  <input type="tel" id="fieldPhone" placeholder="Optional">
                </div>
              </div>
              <div class="form-group">
                <label>Bio</label>
                <textarea rows="3" id="fieldBio" placeholder="A short bio…"></textarea>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Location</label>
                  <input type="text" id="fieldLocation">
                </div>
                <div class="form-group">
                  <label>Timezone</label>
                  <select id="fieldTimezone">
                    <option>Pacific Time (PT)</option>
                    <option>Mountain Time (MT)</option>
                    <option>Central Time (CT)</option>
                    <option>Eastern Time (ET)</option>
                    <option>UTC</option>
                  </select>
                </div>
              </div>
            </form>
          </section>
        </div>

        <!-- Danger zone -->
        <section class="card danger-card">
          <div class="card-header">
            <h2>Danger zone</h2>
          </div>
          <div class="settings-item">
            <div class="settings-text">
              <h3>Delete account</h3>
              <p>Permanently remove your account and all data</p>
            </div>
            <button class="btn-danger" type="button" id="deleteAccountBtn">Delete account</button>
          </div>
        </section>
      </main>
    </div>
      <script src="app.js"></script>
  </body>
</html>
